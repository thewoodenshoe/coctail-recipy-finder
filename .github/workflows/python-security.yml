name: Python security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audit.txt
      - name: Install audit tool
        run: python -m pip install --requirement requirements-audit.txt
      - name: Install and test application
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check
          python -m pytest -q
      - name: Audit application dependency graph
        run: python -m pip_audit --requirement requirements.txt
