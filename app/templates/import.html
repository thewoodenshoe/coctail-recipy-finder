{% extends "base.html" %}
{% block title %}Import Caption - Cocktail Recipe Finder{% endblock %}
{% block content %}
  <section class="panel">
    <h1>Import Post Caption</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/import" class="stacked-form">
      <label>
        Creator handle
        <input name="creator" placeholder="notjustabartender" required>
      </label>
      <label>
        Instagram post URL
        <input name="source_url" placeholder="https://www.instagram.com/p/..." required>
      </label>
      <label>
        Caption text
        <textarea name="caption_text" rows="14" required></textarea>
      </label>
      <button type="submit">Import and index</button>
    </form>
  </section>
{% endblock %}
